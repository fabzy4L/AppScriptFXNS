<!DOCTYPE html>
<html>
  <head>
    <style>
      body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f4f4; }
      .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      .btn { background: #000; color: #fff; padding: 15px 30px; border-radius: 5px; font-size: 16px; border: none; cursor: pointer; margin-top: 15px; width: 100%; }
      #status { margin-top: 20px; font-weight: bold; color: #333; }
      input { margin: 20px 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>LabMind Lens 👁️</h2>
      <p>Upload a photo of equipment, reagents, or labels.</p>
      <input type="file" id="fileInput" accept="image/*">
      <br>
      <button class="btn" onclick="upload()">Analyze</button>
      <div id="status"></div>
    </div>

    <script>
      function upload() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) { alert("Please take a photo first!"); return; }
        
        document.getElementById('status').innerText = "Thinking... (Sending to Cloud)";
        
        const reader = new FileReader();
        reader.onload = function(e) {
          google.script.run
            .withSuccessHandler(msg => document.getElementById('status').innerText = msg)
            .withFailureHandler(err => document.getElementById('status').innerText = "Error: " + err)
            .processUpload(e.target.result);
        };
        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
